name: Agent-Friendly Portfolio

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: agent-docs-${{ github.ref }}

jobs:
  agent-docs:
    name: Validate agent access
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portfolio
        run: pnpm build

      - name: Start portfolio
        run: |
          pnpm --filter www start > /tmp/portfolio-www.log 2>&1 &
          echo "$!" > /tmp/portfolio-www.pid

      - name: Wait for portfolio
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3100/llms.txt > /dev/null && curl -fsS http://localhost:3100/sitemap.xml > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/portfolio-www.log
          exit 1

      - name: Run AFDocs checks
        run: pnpm agent-docs

      - name: Print portfolio log after failure
        if: failure()
        run: test ! -f /tmp/portfolio-www.log || cat /tmp/portfolio-www.log

      - name: Stop portfolio
        if: always()
        run: test ! -f /tmp/portfolio-www.pid || kill "$(cat /tmp/portfolio-www.pid)" || true
