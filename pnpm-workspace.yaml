packages:
  - apps/*
  - packages/*

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - react-doctor@0.9.7
  - deslop-js@0.9.7
  - oxlint-plugin-react-doctor@0.9.7
  - turbo@2.10.9
  - "@turbo/darwin-64@2.10.9"
  - "@turbo/darwin-arm64@2.10.9"
  - "@turbo/linux-64@2.10.9"
  - "@turbo/linux-arm64@2.10.9"
  - "@turbo/windows-64@2.10.9"
  - "@turbo/windows-arm64@2.10.9"

overrides:
  "@vitest/mocker": "^4.1.12"
  dompurify: "^3.4.17"
  katex: "^0.18.2"
  "postcss-selector-parser": "^6.1.5"
  "source-map-js": "^1.2.2"
  zod: "^4.6.6"
  "nanoid@<3.3.18": "3.3.18"

allowBuilds:
  # Effect's msgpackr dependency can use this optional native accelerator, but
  # the portfolio does not use MessagePack. Keep the install script disabled.
  msgpackr-extract: false
  esbuild: true
  sharp: true
  workerd: true

auditConfig:
  ignoreGhsas:
    # deepmerge has no published fix, and only the lint tooling reaches it.
    - GHSA-gcqx-w48m-w2h4
